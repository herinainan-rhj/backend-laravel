<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Blog Laravel</title>
</head>
<body>

    <h2>Créer un article</h2>

    <form id="blogForm">
        <p>
            <label>Titre :</label><br>
            <input type="text" name="titre" required>
        </p>

        <p>
            <label>Description :</label><br>
            <textarea name="description" rows="5" required></textarea>
        </p>

        <p>
            <label>Date de publication :</label><br>
            <input type="date" name="date_publication" required>
        </p>

        <p>
            <label>Image :</label><br>
            <input type="file" name="image" accept=".jpg,.jpeg,.png" required>
        </p>

        <button type="submit">Publier</button>
    </form>

    <hr>

    <h3>Réponse du serveur</h3>
    <pre id="resultat"></pre>

    <script>
        document.getElementById('blogForm').addEventListener('submit', async function(e) {

            e.preventDefault();

            const formData = new FormData(this);

            try {

                const response = await fetch('http://127.0.0.1:8000/api/blogs', {
                    method: 'POST',
                    body: formData
                });

                const text = await response.text();

                document.getElementById('resultat').textContent = text;

            } catch (error) {

                document.getElementById('resultat').textContent = error.message;
            }

        });
    </script>

</body>
</html>
